# Builds and tests on every push; on a version tag (v1.2.3) also publishes the
# self-contained Windows package to a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/HeartBeat.Core.Tests -c Release

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./tools/publish.ps1 -Version "${{ github.ref_name }}".TrimStart('v')

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
